<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#101d2c" />
    {% seo %}
    <link
      rel="icon"
      href="{{ '/assets/favicon.svg' | relative_url }}"
      type="image/svg+xml"
    />
    <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    {% include header.html %}
    <main id="main" {% unless page.home %}class="legal wrap" {% endunless %}>
      {{ content }}
    </main>
    {% include footer.html %}
  </body>
</html>
